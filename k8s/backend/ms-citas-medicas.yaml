apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-citas-medicas
  namespace: petdate
  labels: { app: ms-citas-medicas, tier: app }
spec:
  replicas: 2
  selector: { matchLabels: { app: ms-citas-medicas } }
  template:
    metadata: { labels: { app: ms-citas-medicas, tier: app } }
    spec:
      nodeSelector: { tier: app }
      containers:
        - name: ms-citas-medicas
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/repo_petdate_ms-citas-medicas:${IMAGE_TAG}
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: petdate-config }
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: SPRING_DATA_MONGODB_URI } }
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "768Mi" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8084 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8084 }, initialDelaySeconds: 45, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: ms-citas-medicas, namespace: petdate }
spec:
  type: ClusterIP
  selector: { app: ms-citas-medicas }
  ports: [{ protocol: TCP, port: 8084, targetPort: 8084 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ms-citas-medicas-hpa, namespace: petdate }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ms-citas-medicas }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
