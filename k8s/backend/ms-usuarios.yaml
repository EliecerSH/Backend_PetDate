apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-usuarios
  namespace: petdate
  labels:
    app: ms-usuarios
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-usuarios
  template:
    metadata:
      labels:
        app: ms-usuarios
        tier: app
    spec:
      nodeSelector:
        tier: app
      containers:
        - name: ms-usuarios
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/repo_petdate_ms-usuarios:${IMAGE_TAG}
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: petdate-config }
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: JWT_SECRET } }
            - name: SPRING_DATA_MONGODB_URI
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: SPRING_DATA_MONGODB_URI } }
            - name: MAIL_USERNAME
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: MAIL_USERNAME } }
            - name: MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: MAIL_PASSWORD } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: ADMIN_PASSWORD } }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 45
            periodSeconds: 15
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: petdate-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ms-usuarios
  namespace: petdate
spec:
  type: ClusterIP
  selector:
    app: ms-usuarios
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-usuarios-hpa
  namespace: petdate
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ms-usuarios }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
