apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-servicios
  namespace: petdate
  labels: { app: ms-servicios, tier: app }
spec:
  replicas: 2
  selector: { matchLabels: { app: ms-servicios } }
  template:
    metadata: { labels: { app: ms-servicios, tier: app } }
    spec:
      nodeSelector: { tier: app }
      containers:
        - name: ms-servicios
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/repo_petdate_ms-servicios:${IMAGE_TAG}
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: petdate-config }
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: SPRING_DATA_MONGODB_URI } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: JWT_SECRET } }
            - name: MAIL_USERNAME
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: MAIL_USERNAME } }
            - name: MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: petdate-secrets, key: MAIL_PASSWORD } }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "768Mi" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8083 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8083 }, initialDelaySeconds: 45, periodSeconds: 15 }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: petdate-uploads-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: ms-servicios, namespace: petdate }
spec:
  type: ClusterIP
  selector: { app: ms-servicios }
  ports: [{ protocol: TCP, port: 8083, targetPort: 8083 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ms-servicios-hpa, namespace: petdate }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ms-servicios }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
